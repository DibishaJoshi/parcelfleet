{% extends "base.html" %}

{% block title %}Company Settings - ParcelFleet{% endblock %}
{% block page_title %}Company Profile & System Settings{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="card border-0 shadow-sm rounded-4 bg-white p-4 p-md-5">
            <h4 class="fw-bold text-dark mb-4 pb-3 border-bottom"><i class="fas fa-sliders text-primary me-2"></i>Company & Branding Settings</h4>

            <form method="POST" action="{{ url_for('company_settings') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Company Registered Name *</label>
                    <input type="text" name="company_name" class="form-control rounded-3" value="{{ setting.company_name if setting else 'ParcelFleet' }}" required>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Support Contact Phone</label>
                        <input type="text" name="phone" class="form-control rounded-3" value="{{ setting.phone if setting else '+977-1-4567890' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Support Email</label>
                        <input type="email" name="email" class="form-control rounded-3" value="{{ setting.email if setting else 'support@parcelfleet.com.np' }}">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Headquarters Address</label>
                        <input type="text" name="address" class="form-control rounded-3" value="{{ setting.address if setting else 'Patan, Lalitpur, Nepal' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">VAT / PAN No</label>
                        <input type="text" name="vat_pan_number" class="form-control rounded-3" value="{{ setting.vat_pan_number if setting else '601234567' }}">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Terms & Conditions (Printed on Labels)</label>
                    <textarea name="terms_conditions" class="form-control rounded-3" rows="3">{{ setting.terms_conditions if setting else '' }}</textarea>
                </div>

                <button type="submit" class="btn btn-primary rounded-pill px-5 fw-bold shadow">
                    <i class="fas fa-save me-1"></i>Save Company Settings
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
